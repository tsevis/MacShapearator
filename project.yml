name: MacShapearator
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.tsevis.MacShapearator
    # Follows the Shapearator engine release this app is built against, so the
    # version in Finder and About names the engine doing the work. It moves
    # ahead of the engine for a fix that is only in the packaging, and falls
    # back in step at the next shared release -- 0.4.9 shipped engine v0.4.8
    # with a corrected minimum macOS; 0.4.12 ships engine v0.4.12.
    MARKETING_VERSION: "0.4.12"
    CURRENT_PROJECT_VERSION: "1"
    # Not a choice: the bundled interpreter, OpenSSL and potrace come from
    # pyenv and Homebrew carrying this machine's deployment target, and the
    # highest of them is 15.4. Declaring 13.0 promised macOS the app could
    # open on but never start its engine on. Scripts/check_minimum_os.py
    # fails the build if the two drift apart again.
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    SWIFT_VERSION: "5.9"
    # The packaged app is built by xcodebuild, not SwiftPM, so the checking
    # Package.swift turns on has to be turned on here too or it only ever
    # runs in `swift build`.
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  MacShapearator:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacShapearator
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/BundledBackend
        type: folder
        buildPhase: resources
      - path: Resources/BundledPython
        type: folder
        buildPhase: resources
      - path: Resources/BundledBin
        type: folder
        buildPhase: resources
      - path: Resources/ThirdParty
        type: folder
        buildPhase: resources
      - path: Resources/Scripts
        type: folder
        buildPhase: resources
      - path: Resources/IconVariants
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: MacShapearator
        INFOPLIST_KEY_CFBundleDisplayName: MacShapearator
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Tsevis"
        # Desktop, Documents and Downloads are TCC-protected. Without a reason
        # string macOS denies access without prompting, and the extraction fails
        # with a bare "No such file or directory" when writing to those folders.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "MacShapearator needs access to read icon sheets from your Desktop and write extracted icons there."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "MacShapearator needs access to read icon sheets from your Documents and write extracted icons there."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "MacShapearator needs access to read icon sheets from your Downloads and write extracted icons there."
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "MacShapearator needs access to read icon sheets from external volumes and write extracted icons there."
schemes:
  MacShapearator:
    build:
      targets:
        MacShapearator: all
