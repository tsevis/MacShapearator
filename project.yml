name: MacShapearator
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.tsevis.MacShapearator
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  MacShapearator:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacShapearator
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/BundledBackend
        type: folder
        buildPhase: resources
      - path: Resources/BundledPython
        type: folder
        buildPhase: resources
      - path: Resources/BundledBin
        type: folder
        buildPhase: resources
      - path: Resources/ThirdParty
        type: folder
        buildPhase: resources
      - path: Resources/Scripts
        type: folder
        buildPhase: resources
      - path: Resources/IconVariants
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: MacShapearator
        INFOPLIST_KEY_CFBundleDisplayName: MacShapearator
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Tsevis"
        # Desktop, Documents and Downloads are TCC-protected. Without a reason
        # string macOS denies access without prompting, and the extraction fails
        # with a bare "No such file or directory" when writing to those folders.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "MacShapearator needs access to read icon sheets from your Desktop and write extracted icons there."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "MacShapearator needs access to read icon sheets from your Documents and write extracted icons there."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "MacShapearator needs access to read icon sheets from your Downloads and write extracted icons there."
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "MacShapearator needs access to read icon sheets from external volumes and write extracted icons there."
schemes:
  MacShapearator:
    build:
      targets:
        MacShapearator: all
